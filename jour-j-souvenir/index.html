<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notre jour J">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Notre jour J</title>
<style>
@font-face{font-family:Pop;src:url(fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:Pop;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Pop;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:Cal;src:url(fonts/Caladea-Italic.ttf);font-style:italic}

:root{
  --cream:#FFF7EC; --ink:#23262F; --soft:#6E665B; --line:#EADCC8; --white:#FFFFFF;
  --red:#DA291C; --red-d:#A11D13; --yel:#FFC20E; --yel-d:#C99400; --blu:#0A6EBD; --blu-d:#06508A;
  --grn:#00A651; --grn-d:#007A3B; --org:#F7901E; --org-d:#BE6A0E; --pnk:#EC6FA5; --pnk-d:#B5477A;
  --pur:#8E5CC4; --pur-d:#653E95; --azu:#36AEBF; --azu-d:#1F7F8C;
  --top:max(14px, env(safe-area-inset-top)); --bot:max(14px, env(safe-area-inset-bottom));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pop,system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.4;
  background-color:var(--cream);
  background-image:radial-gradient(circle, #F6E8D5 0 5px, rgba(0,0,0,.035) 5.4px, transparent 6px);
  background-size:28px 28px;background-position:14px 14px;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:left}
.screen{display:none;min-height:100%;padding:var(--top) 16px calc(var(--bot) + 8px);max-width:560px;margin:0 auto}
.screen.on{display:block}
.screen#step{padding-bottom:calc(var(--bot) + 104px)}

/* ---------- studs + bricks ---------- */
.studs{position:absolute;left:12px;right:12px;top:-8px;height:10px;display:flex;justify-content:space-around;pointer-events:none}
.studs b{width:24px;height:10px;border-radius:5px 5px 1px 1px;background:var(--c, #fff);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.12)}
.brick{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  min-height:72px;padding:12px 18px;border-radius:14px;background:var(--c);color:#fff;
  box-shadow:inset 0 -6px 0 var(--cd), 0 6px 14px rgba(60,30,0,.10);font-weight:700;font-size:20px;
  transition:transform .08s, box-shadow .08s}
.brick:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--cd), 0 3px 8px rgba(60,30,0,.10)}
.brick small{display:block;font-weight:500;font-size:14px;opacity:.92;margin-top:2px}
.brick.yel{--c:var(--yel);--cd:var(--yel-d);color:var(--ink)}
.brick.red{--c:var(--red);--cd:var(--red-d)}
.brick.blu{--c:var(--blu);--cd:var(--blu-d)}
.brick.grn{--c:var(--grn);--cd:var(--grn-d)}
.brick.white{--c:#FFFFFF;--cd:#E2D6C5;color:var(--ink)}
.brick.white .studs b{background:#fff;box-shadow:inset 0 -1px 0 #E2D6C5, 0 0 0 1px #EFE4D4}
.stack{display:flex;flex-direction:column;gap:22px;margin-top:24px}

/* ---------- home ---------- */
.hbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.datechip{position:relative;background:var(--red);color:#fff;font-weight:700;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;
  padding:8px 14px 7px;border-radius:9px;box-shadow:inset 0 -4px 0 var(--red-d);margin-top:8px}
.datechip .studs{left:8px;right:8px;top:-6px;height:7px}
.datechip .studs b{width:14px;height:7px;--c:var(--red)}
.round{width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:26px;
  box-shadow:inset 0 -4px 0 #E2D6C5, 0 4px 10px rgba(60,30,0,.08)}
.round:active{transform:translateY(2px)}
.names{font-family:Cal;font-style:italic;font-size:24px;color:#B08D57;text-align:center;margin-top:14px}
.title{font-weight:700;font-size:36px;line-height:1.05;text-align:center;letter-spacing:-.5px}
.title i{font-style:normal;color:var(--red)}
.info{text-align:center;margin-top:12px}
.pill{display:inline-block;background:#fff;border-radius:30px;padding:8px 16px;font-weight:500;font-size:16px;box-shadow:0 3px 10px rgba(60,30,0,.07)}
.pill b{color:var(--red)}
.clock{font-weight:700;font-size:46px;line-height:1}
.chip{display:inline-block;border-radius:30px;padding:6px 14px;font-weight:700;font-size:15px;margin-top:6px}
.chip.ok{background:#DDF4E6;color:#0B6B37}.chip.warn{background:#FFEFC7;color:#8A5A00}.chip.neutral{background:#E9EEF6;color:#2B4C7E}
.prog-now{font-size:15px;color:var(--soft);margin-top:6px}
.heartbox{margin:16px auto 0;width:min(84vw,330px)}
.heart{width:100%;height:auto;display:block;overflow:visible}
.heart .ghost{fill:rgba(255,255,255,.55);stroke:#DCCAB2;stroke-width:2.4;stroke-dasharray:7 6}
.heart .b.drop{animation:drop .85s cubic-bezier(.34,1.56,.64,1) both}
@keyframes drop{0%{transform:translateY(-190px);opacity:0}35%{opacity:1}100%{transform:none;opacity:1}}
.heart.full{animation:beat 1.4s ease-in-out infinite;transform-origin:50% 55%}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.06)}30%{transform:scale(1)}45%{transform:scale(1.04)}}
.count{text-align:center;font-weight:700;font-size:20px;margin-top:10px}
.count span{display:block;font-weight:400;font-size:15px;color:var(--soft)}
.foot{text-align:center;font-size:13px;color:#A2988B;margin-top:22px}

/* ---------- step ---------- */
.sbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mini{flex:1;display:flex;gap:3px;justify-content:center;flex-wrap:nowrap}
.mini i{flex:1;max-width:14px;height:16px;border-radius:3px;background:#fff;box-shadow:inset 0 0 0 1.6px #DCCAB2}
.mini i.on{background:var(--red);box-shadow:inset 0 -3px 0 var(--red-d)}
.mini i.cur{box-shadow:inset 0 0 0 2.6px var(--red)}
.hero{position:relative;margin-top:26px;border-radius:20px;padding:20px 18px 18px;color:#fff;background:var(--c);
  box-shadow:inset 0 -8px 0 var(--cd), 0 8px 18px rgba(60,30,0,.12)}
.hero.lt{color:var(--ink)}
.hero .studs{top:-10px;height:12px;left:16px;right:16px}
.hero .studs b{width:32px;height:12px}
.hero .row{display:flex;align-items:center;gap:14px}
.emoji{font-size:54px;line-height:1;width:78px;height:78px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.hero .time{font-weight:700;font-size:20px;opacity:.95}
.hero h2{font-weight:700;font-size:28px;line-height:1.12;margin-top:2px}
.hero .fun{font-family:Cal;font-style:italic;font-size:19px;margin-top:10px;opacity:.95}
.silence{display:flex;align-items:center;gap:10px;margin-top:16px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:18px}
.silence span{font-size:26px}
.daychip{text-align:center;margin-top:14px}
.note{background:#fff;border-radius:14px;padding:12px 16px;margin-top:14px;font-size:16px;color:var(--soft);box-shadow:0 3px 10px rgba(60,30,0,.06)}
.acts{display:flex;flex-direction:column;gap:22px;margin-top:26px}
.act{--c:var(--rc);--cd:var(--rcd);justify-content:flex-start;text-align:left;min-height:80px;padding:12px 14px;font-weight:500}
.act.white{--c:#FFFFFF;--cd:#E2D6C5;color:var(--ink)}
.act .ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--c)}
.act.white .ico{background:var(--tint)}
.act .tx{flex:1;min-width:0}
.act .who{display:block;font-size:12.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;opacity:.8}
.act.white .who{color:var(--rcd);opacity:1}
.act .what{display:block;font-size:18px;line-height:1.28;font-weight:500}
.act .tick{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700}
.act.white .tick{border:3px solid #D7C8B4;color:transparent}
.act.done .tick{background:#fff;color:var(--c)}
.act.done .ico{background:rgba(255,255,255,.25)}
.act.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
.act .stamp{display:block;font-size:13px;opacity:.9;margin-top:2px}
.alldone{margin-top:26px}
.posed{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;background:#DDF4E6;color:#0B6B37;border-radius:16px;padding:16px;font-weight:700;font-size:19px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 16px var(--bot);background:linear-gradient(rgba(255,247,236,0),var(--cream) 30%);z-index:10}
.bottom .in{max-width:528px;margin:0 auto;display:flex;gap:14px;align-items:center}
.bottom .brick{min-height:68px;font-size:18px}
.bottom .nav{flex:1}
.bottom .nav.off{visibility:hidden}

/* ---------- programme ---------- */
.ptitle{font-weight:700;font-size:26px;flex:1;text-align:center}
.part{display:flex;align-items:baseline;gap:8px;margin:26px 4px 10px}
.part b{font-family:Cal;font-style:italic;font-weight:400;color:#B08D57;font-size:20px}
.part span{font-weight:700;font-size:18px;flex:1}
.part small{font-size:13px;color:var(--soft)}
.prow{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:10px 14px;background:#fff;border-radius:16px;margin-top:12px;
  box-shadow:inset 0 -4px 0 #E8DCCB, 0 3px 8px rgba(60,30,0,.05)}
.prow:active{transform:translateY(2px)}
.prow .num{position:relative;flex:none;width:50px;height:44px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:19px;
  background:#fff;box-shadow:inset 0 0 0 2px #DCCAB2;color:var(--soft)}
.prow.done .num{background:var(--red);color:#fff;box-shadow:inset 0 -4px 0 var(--red-d)}
.prow.cur{box-shadow:inset 0 0 0 3px var(--yel), inset 0 -4px 0 #E8DCCB}
.prow .pt{flex:1;min-width:0}
.prow .pt b{display:block;font-size:14px;color:var(--soft);font-weight:500}
.prow .pt span{display:block;font-weight:700;font-size:17px;line-height:1.25}
.prow .pe{font-size:30px;flex:none}
.prow .tag{font-style:normal;display:inline-block;font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:2px}

/* ---------- overlays ---------- */
.ovl{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(35,38,47,.5)}
.ovl.on{display:flex}
.ovl.center{align-items:center}
.card{position:relative;width:100%;max-width:560px;background:var(--cream);border-radius:26px 26px 0 0;padding:22px 18px calc(var(--bot) + 14px);
  animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
.ovl.center .card{border-radius:26px;margin:16px;width:calc(100% - 32px);padding-bottom:22px}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.card h2{font-weight:700;font-size:30px;text-align:center;line-height:1.1}
.card .sub{text-align:center;color:var(--soft);font-size:17px;margin-top:6px}
.card .sub b{color:var(--ink)}
.card .heartbox{width:min(62vw,240px);margin-top:4px}
.card .stack{gap:20px;margin-top:22px}
.ghostbtn{width:100%;text-align:center;min-height:60px;border-radius:14px;font-weight:500;font-size:17px;color:var(--soft);background:#fff;box-shadow:inset 0 0 0 2px #E6D8C5}
.setrow{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 14px;background:#fff;border-radius:16px;margin-top:12px;box-shadow:inset 0 -4px 0 #E8DCCB}
.setrow .si{font-size:28px;flex:none;width:40px;text-align:center}
.setrow .st{flex:1}
.setrow .st b{display:block;font-weight:700;font-size:17px}
.setrow .st small{display:block;font-size:14px;color:var(--soft);line-height:1.3}
.sw{flex:none;width:62px;height:36px;border-radius:20px;background:#D9CDBC;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--grn)}
.sw.on::after{transform:translateX(26px)}
.simctl{display:none;align-items:center;gap:12px;margin-top:12px}
.simctl.on{display:flex}
.simctl button{flex:1;min-height:60px;border-radius:14px;background:#fff;font-weight:700;font-size:18px;text-align:center;box-shadow:inset 0 -4px 0 #E2D6C5}
.simctl output{font-weight:700;font-size:24px;min-width:90px;text-align:center}
.danger{width:100%;text-align:center;min-height:64px;border-radius:14px;margin-top:16px;font-weight:700;font-size:17px;color:#A3253F;background:#fff;box-shadow:inset 0 0 0 2px #EDBCC7}
.danger.armed{background:#A3253F;color:#fff}

/* ---------- wipe transition ---------- */
#wipe{position:fixed;inset:0;z-index:90;pointer-events:none;display:none;flex-direction:column;overflow:hidden}
#wipe.on{display:flex}
#wipe .row{flex:1;display:flex;gap:5px;padding:7px 0 0;transform:translateX(var(--from));will-change:transform}
#wipe.go .row{transition:transform .3s cubic-bezier(.55,0,.25,1);transition-delay:calc(var(--i) * 32ms)}
#wipe.in .row{transform:translateX(0)}
#wipe.out .row{transform:translateX(var(--to))}
#wipe .wb{position:relative;flex:var(--w) 0 0;border-radius:8px;background:var(--c);box-shadow:inset 0 -6px 0 var(--cd)}
#wipe .wb::before{content:"";position:absolute;left:8%;right:8%;top:-7px;height:8px;
  background:radial-gradient(ellipse 11px 7px at 50% 100%, var(--c) 96%, transparent 100%) 0 0/34px 8px repeat-x}
#wipe.fade{background:var(--cream);opacity:0;transition:opacity .2s}
#wipe.fade.in{opacity:1}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 96px);transform:translate(-50%,30px);background:var(--ink);color:#fff;border-radius:16px;padding:14px 20px;
  font-size:17px;font-weight:500;max-width:calc(100% - 32px);opacity:0;transition:all .25s;z-index:95;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:85}
@media (prefers-reduced-motion: reduce){.heart .b.drop,.heart.full,.act.pop,.card{animation:none}}
/* ---------- v3 : plan B, tags, infos ---------- */
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tagx{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border-radius:10px;padding:5px 10px;background:rgba(255,255,255,.24)}
.hero.lt .tagx{background:rgba(0,0,0,.08)}
.planbar{display:flex;align-items:center;gap:12px;margin-top:14px;background:#FFF1D6;border:2px dashed #E9B949;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.35;text-align:left}
.planbar b{font-weight:700}
.planbar .pi{font-size:26px;flex:none}
.decide{margin-top:30px;background:#fff;border-radius:18px;padding:16px 16px 18px;box-shadow:inset 0 -4px 0 #E8DCCB, 0 3px 10px rgba(60,30,0,.06)}
.decide h3{font-weight:700;font-size:19px;line-height:1.25}
.decide p{font-size:15px;color:var(--soft);margin-top:4px}
.decide .stack{gap:22px;margin-top:22px}
.brick.org{--c:var(--org);--cd:var(--org-d)}

.info-card{background:#fff;border-radius:18px;padding:14px 16px;margin-top:16px;box-shadow:inset 0 -4px 0 #E8DCCB}
.info-card h4{font-weight:700;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:#B08D57}
.info-card p{font-size:16px;margin-top:4px;line-height:1.45}
.planswitch{display:flex;gap:12px;margin-top:20px}
.planswitch button{flex:1;min-height:64px;border-radius:14px;font-weight:700;font-size:16px;text-align:center;background:#fff;box-shadow:inset 0 0 0 2px #E2D6C5;color:var(--soft);line-height:1.2;padding:8px}
.planswitch button.on{background:var(--ink);color:#fff;box-shadow:inset 0 -4px 0 #000}

/* ---------- v4 : souvenir ---------- */
.big-title{font-weight:700;font-size:46px;line-height:1;text-align:center;letter-spacing:-.6px;margin-top:4px}
.big-title span{color:var(--red)}
.where{font-family:Cal;font-style:italic;font-size:18px;color:var(--soft);text-align:center;margin-top:8px}
.heartbtn{display:block;margin:12px auto 0;width:min(84vw,330px);padding:0;background:none}
.since{text-align:center;margin-top:10px}
.since .n{font-weight:700;font-size:22px}
.since small{display:block;font-size:15px;color:var(--soft)}
.anniv{display:flex;align-items:center;gap:12px;margin-top:16px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:inset 0 -4px 0 #E8DCCB}
.anniv .ai{font-size:30px;flex:none}
.anniv b{display:block;font-weight:700;font-size:16px}
.anniv small{display:block;font-size:14px;color:var(--soft)}
.ptitle2{font-weight:700;font-size:30px;text-align:center;margin-top:18px;line-height:1.1}
.lead{text-align:center;color:var(--soft);font-size:16px;margin-top:6px}
.msg{position:relative;border-radius:18px;padding:18px 16px 16px;margin-top:26px;color:#fff;background:var(--c);
  box-shadow:inset 0 -6px 0 var(--cd), 0 6px 14px rgba(60,30,0,.10)}
.msg.lt{color:var(--ink)}
.msg .me{font-size:36px;line-height:1}
.msg p{font-size:19px;line-height:1.38;font-weight:500;margin-top:8px}
.thanks{background:#fff;border-radius:18px;padding:16px;margin-top:28px;box-shadow:inset 0 -4px 0 #E8DCCB;font-size:16px;line-height:1.45}
.thanks h4{font-weight:700;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:#B08D57;margin-bottom:4px}
.stats{display:flex;gap:10px;margin-top:18px}
.stat{flex:1;background:#fff;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:inset 0 -4px 0 #E8DCCB}
.stat b{display:block;font-weight:700;font-size:24px}
.stat small{display:block;font-size:12.5px;color:var(--soft);line-height:1.2}
.drow{display:flex;align-items:center;gap:14px;min-height:72px;padding:10px 14px;background:#fff;border-radius:16px;margin-top:12px;box-shadow:inset 0 -4px 0 #E8DCCB}
.drow .num{flex:none;width:50px;height:44px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--red);color:#fff;box-shadow:inset 0 -4px 0 var(--red-d)}
.drow.todo .num{background:#fff;color:var(--soft);box-shadow:inset 0 0 0 2px #DCCAB2}
.drow .pt{flex:1;min-width:0}
.drow .pt b{display:block;font-size:14px;color:var(--soft);font-weight:500}
.drow .pt span{display:block;font-weight:700;font-size:17px;line-height:1.25}
.drow .pe{font-size:30px;flex:none}
.endcard{text-align:center;margin-top:28px;font-family:Cal;font-style:italic;font-size:21px;color:#B08D57}
</style>
</head>
<body>
<section class="screen" id="home"></section>
<section class="screen" id="msgs"></section>
<section class="screen" id="day"></section>
<div id="ovl" class="ovl"></div>
<div id="wipe" aria-hidden="true"></div>
<div id="toast" class="toast" role="status"></div>
<canvas id="fx"></canvas>

<script>
(function(){
"use strict";

/* ================================================================ data */
var WEDDING = new Date(2026, 9, 24);
var COL = {red:["#DA291C","#A11D13"], yel:["#FFC20E","#C99400"], blu:["#0A6EBD","#06508A"], grn:["#00A651","#007A3B"],

    var W = p.s * p.w, H = p.s * .8;
    cx.fillStyle = p.c[0]; cx.strokeStyle = p.c[1]; cx.lineWidth = 1.2;
    for (var k = 0; k < p.w; k++) cx.fillRect(-W / 2 + p.s * k + p.s * .22, -H / 2 - p.s * .22, p.s * .56, p.s * .26);
    cx.fillRect(-W / 2, -H / 2, W, H); cx.strokeRect(-W / 2, -H / 2, W, H);
    cx.restore();
  });
  if (parts.length) raf = requestAnimationFrame(tick); else { raf = 0; cx.clearRect(0, 0, innerWidth, innerHeight); }
}
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2400);
}
var LOVE = ["Vive les mariés ! 💖", "Bisous ! 💋", "Pour toujours 💍", "Que du bonheur ✨", "Encore bravo ! 🎉"], li = 0;

/* ================================================================ events */
var lastTap = 0;
document.addEventListener("click", function(ev){
  var t = ev.target.closest("button"); if (!t) return;
  var nowT = Date.now();
  if (busy || nowT - lastTap < 320) { ev.preventDefault(); return; }
  lastTap = nowT;
  var ds = t.dataset;
  if (ds.go) { sfx("tap"); navPush({v:ds.go}); return; }
  if (ds.back) { sfx("tap"); navBack(); return; }
  if (ds.heart) { sfx("chime"); haptic(); burst(90); toast(LOVE[li++ % LOVE.length]); return; }
  if (ds.replay) { party("Félicitations !", "Toutes les briques sont posées : le cœur est complet 💖"); return; }
  if (ds.again) { closeOverlay(function(){ setTimeout(function(){ party("Encore bravo !", "Vive les mariés ! 🎉"); }, 120); }); return; }
  if (ds.setOpen) { sfx("tap"); settings(); return; }
  if (ds.close) { closeOverlay(function(){ renderView(); }); return; }
  if (ds.tog === "sound") { S.sound = !S.sound; save(); if (S.sound) sfx("tap"); renderSettings(); return; }
});
ovl.addEventListener("click", function(ev){ if (ev.target === ovl) closeOverlay(function(){ renderView(); }); });

/* ================================================================ start */
renderView();
if (!S.souvenir) {
  S.souvenir = Date.now(); save();
  setTimeout(function(){ party("La fête est finie…", "…et votre histoire commence ! 💖", true); }, 450);
}
if ("serviceWorker" in navigator && location.protocol === "https:") {
  var hadCtrl = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){ if (hadCtrl && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
window.__souvenir = {S:S, DAY:DAY, go:function(v){ navPush({v:v}); }, party:party};
